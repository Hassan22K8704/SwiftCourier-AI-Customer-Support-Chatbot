name: MLOps Pipeline — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/test_lambda.py -v

      - name: Check code quality
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E501

  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test  # Only deploys if tests pass
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package Lambda function
        run: |
          mkdir -p package
          pip install openai boto3 -t package/
          cp src/lambda_function.py package/
          cp src/utils.py package/
          cd package && zip -r ../deployment.zip . && cd ..

      - name: Upload new prompt to S3 (if changed)
        run: |
          aws s3 cp src/prompt.txt s3://courier-ai-assistant-bucket/prompts/prompt.txt

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name courier-ai-assistant \
            --zip-file fileb://deployment.zip

      - name: Wait for deployment to complete
        run: |
          aws lambda wait function-updated \
            --function-name courier-ai-assistant

      - name: Verify deployment (smoke test)
        run: |
          RESPONSE=$(aws lambda invoke \
            --function-name courier-ai-assistant \
            --payload '{"body": "{\"message\": \"hello\", \"session_id\": \"smoke-test\"}"}' \
            --cli-binary-format raw-in-base64-out \
            output.json && cat output.json)
          echo "Smoke test response: $RESPONSE"
          # Fail pipeline if response doesn't contain statusCode 200
          echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['statusCode']==200, 'Smoke test failed!'"

      - name: Notify on success
        run: echo "Deployment successful at $(date)"
